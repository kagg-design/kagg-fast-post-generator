name: KAGG Fast Post Generator CI

on:
  workflow_dispatch:
  push:
    paths: &ci-paths
      - '**/*.php'
      - 'composer.*'
      - 'phpcs.xml'
      - 'assets/**'
      - 'tests/**'
      - '.github/**'
      - '.distignore'
      - '.gitattributes'
      - 'readme.txt'
      - 'changelog.txt'
  pull_request:
    paths: *ci-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP coding standards and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer audit
      - run: composer phpcs
      - run: composer changelog:check

  js:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --check assets/js/admin.js

  php_versions:
    name: Resolve stable PHP matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    env:
      FULL_PHP_MATRIX: ${{ github.event_name == 'pull_request' }}
    steps:
      - id: resolve
        run: |
          if [ "$FULL_PHP_MATRIX" = "true" ]; then
            echo 'matrix=["7.4","8.0","8.1","8.2","8.3","8.4","8.5"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["7.4","8.5"]' >> "$GITHUB_OUTPUT"
          fi

  php:
    name: PHP ${{ matrix.php-version }} and WordPress 7.1.4
    runs-on: ubuntu-latest
    needs: php_versions
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.php_versions.outputs.matrix) }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kagg_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, mysqli, mbstring
          ini-values: mysqli.allow_local_infile=1
          tools: wp-cli
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Lint PHP and check changelog merging
        run: |
          find plugin.php src tests .github/scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          composer test:changelog
      - name: Install isolated WordPress site
        run: |
          wp core download --version=7.1.4 --path="$RUNNER_TEMP/wordpress"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=kagg_tests --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://localhost --title=Tests --admin_user=admin --admin_password=local-test-password --admin_email=test@example.org --skip-email
      - name: Check plugin loading and all four generators
        run: wp --path="$RUNNER_TEMP/wordpress" --skip-plugins --skip-themes eval-file "$GITHUB_WORKSPACE/tests/wordpress.php"
      - name: Check MySQL imports and deletion
        run: wp --path="$RUNNER_TEMP/wordpress" --skip-plugins --skip-themes eval-file "$GITHUB_WORKSPACE/tests/database.php"

  sqlite:
    name: SQLite and WordPress 7.1.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, pdo_sqlite, mbstring
          tools: wp-cli
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Install isolated SQLite WordPress site
        run: |
          wp core download --version=7.1.4 --path="$RUNNER_TEMP/wordpress"
          wp config create --path="$RUNNER_TEMP/wordpress" --dbname=kagg_tests --dbuser=unused --skip-check
          wp config set DB_ENGINE sqlite --path="$RUNNER_TEMP/wordpress"
          wp config set DB_PATH "$RUNNER_TEMP/wordpress/database.sqlite" --path="$RUNNER_TEMP/wordpress"
          curl --fail --location https://downloads.wordpress.org/plugin/sqlite-database-integration.3.1.1.zip --output "$RUNNER_TEMP/sqlite.zip"
          unzip -q "$RUNNER_TEMP/sqlite.zip" -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
          cp "$RUNNER_TEMP/wordpress/wp-content/plugins/sqlite-database-integration/db.copy" "$RUNNER_TEMP/wordpress/wp-content/db.php"
          wp core install --path="$RUNNER_TEMP/wordpress" --url=http://localhost --title=Tests --admin_user=admin --admin_password=local-test-password --admin_email=test@example.org --skip-email
      - name: Check SQLite imports, export, rollback, counts and deletion
        run: wp --path="$RUNNER_TEMP/wordpress" --skip-plugins --skip-themes eval-file "$GITHUB_WORKSPACE/tests/database.php"
