name: KAGG Fast Post Generator CI

on:
  workflow_dispatch:
  push:
    paths: &ci-paths
      - '**/*.php'
      - 'composer.*'
      - 'phpcs.xml'
      - 'phpunit*.xml'
      - 'assets/**'
      - 'tests/**'
      - '.github/**'
      - '.distignore'
      - '.gitattributes'
      - 'readme.txt'
      - 'changelog.txt'
  pull_request:
    paths: *ci-paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP coding standards and release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, dom, mbstring, xml, xmlwriter
          coverage: none
      - uses: ramsey/composer-install@v4
      - run: composer validate --strict
      - run: composer audit
      - run: composer phpcs
      - run: composer changelog:check

  js:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: node --check assets/js/admin.js

  php_versions:
    name: Resolve stable PHP matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    env:
      FULL_PHP_MATRIX: ${{ github.event_name == 'pull_request' }}
    steps:
      - id: resolve
        run: |
          if [ "$FULL_PHP_MATRIX" = "true" ]; then
            echo 'matrix=["7.4","8.0","8.1","8.2","8.3","8.4","8.5"]' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix=["7.4","8.5"]' >> "$GITHUB_OUTPUT"
          fi

  php:
    name: PHP ${{ matrix.php-version }} and WordPress 7.1.4
    runs-on: ubuntu-latest
    needs: php_versions
    env:
      KAGG_TEST_DB_HOST: 127.0.0.1:3306
      KAGG_TEST_DB_NAME: kagg_tests
      KAGG_TEST_DB_USER: root
      KAGG_TEST_DB_PASSWORD: root
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(needs.php_versions.outputs.matrix) }}
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kagg_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: json, dom, mysqli, mbstring, xml, xmlwriter
          ini-values: mysqli.allow_local_infile=1
          tools: wp-cli
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Lint PHP and check changelog merging
        run: |
          find plugin.php src tests .github/scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          composer unit
      - name: Download WordPress core for the PHPUnit suite
        run: |
          wp core download --version=7.1.4 --path="$RUNNER_TEMP/wordpress"
      - name: Run WordPress PHPUnit integration tests on MySQL
        env:
          KAGG_TEST_WORDPRESS_DIR: ${{ runner.temp }}/wordpress
        run: composer integration

  sqlite:
    name: SQLite and WordPress 7.1.4
    runs-on: ubuntu-latest
    env:
      KAGG_TEST_DB_ENGINE: sqlite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: json, dom, pdo_sqlite, mbstring, xml, xmlwriter
          tools: wp-cli
          coverage: none
      - uses: ramsey/composer-install@v4
      - name: Install isolated SQLite WordPress site
        run: |
          wp core download --version=7.1.4 --path="$RUNNER_TEMP/wordpress"
          curl --fail --location https://downloads.wordpress.org/plugin/sqlite-database-integration.3.1.1.zip --output "$RUNNER_TEMP/sqlite.zip"
          unzip -q "$RUNNER_TEMP/sqlite.zip" -d "$RUNNER_TEMP/wordpress/wp-content/plugins"
          cp "$RUNNER_TEMP/wordpress/wp-content/plugins/sqlite-database-integration/db.copy" "$RUNNER_TEMP/wordpress/wp-content/db.php"
      - name: Run WordPress PHPUnit integration tests on SQLite
        env:
          KAGG_TEST_WORDPRESS_DIR: ${{ runner.temp }}/wordpress
          KAGG_TEST_SQLITE_PATH: ${{ runner.temp }}/wordpress/database.sqlite
        run: composer integration
